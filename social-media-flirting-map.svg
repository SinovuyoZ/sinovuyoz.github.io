<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 290" role="img" aria-label="Social Media Flirting prospecting process"><title>Social Media Flirting prospecting process</title><desc>Retrospective playbook showing discovery, salon profile capture, account preparation and follow-up.</desc><rect width="880" height="290" fill="#FAF8F4"/><rect x="24.0" y="36" width="196.0" height="216" fill="white" stroke="#E5E2DC"/><text x="41.0" y="69" fill="#2563EB" font-family="sans-serif" font-size="13">01</text><text x="41.0" y="105" fill="#0F172A" font-family="Georgia,serif" font-size="21">Discover</text><text x="41.0" y="173" fill="#475569" font-family="sans-serif" font-size="12">Find relevant salons</text><text x="41.0" y="190" fill="#475569" font-family="sans-serif" font-size="12">through their social</text><text x="41.0" y="207" fill="#475569" font-family="sans-serif" font-size="12">presence</text><path d="M224.0,142 h8 m-4,-4 l4,4 -4,4" fill="none" stroke="#2563EB" stroke-width="1.5"/><rect x="236.0" y="36" width="196.0" height="216" fill="white" stroke="#E5E2DC"/><text x="253.0" y="69" fill="#2563EB" font-family="sans-serif" font-size="13">02</text><text x="253.0" y="105" fill="#0F172A" font-family="Georgia,serif" font-size="21">Understand</text><text x="253.0" y="173" fill="#475569" font-family="sans-serif" font-size="12">Capture location,</text><text x="253.0" y="190" fill="#475569" font-family="sans-serif" font-size="12">contact, customer</text><text x="253.0" y="207" fill="#475569" font-family="sans-serif" font-size="12">profile and services</text><path d="M436.0,142 h8 m-4,-4 l4,4 -4,4" fill="none" stroke="#2563EB" stroke-width="1.5"/><rect x="448.0" y="36" width="196.0" height="216" fill="white" stroke="#E5E2DC"/><text x="465.0" y="69" fill="#2563EB" font-family="sans-serif" font-size="13">03</text><text x="465.0" y="105" fill="#0F172A" font-family="Georgia,serif" font-size="21">Prepare</text><text x="465.0" y="173" fill="#475569" font-family="sans-serif" font-size="12">Turn the record into a</text><text x="465.0" y="190" fill="#475569" font-family="sans-serif" font-size="12">useful account</text><text x="465.0" y="207" fill="#475569" font-family="sans-serif" font-size="12">conversation</text><path d="M648.0,142 h8 m-4,-4 l4,4 -4,4" fill="none" stroke="#2563EB" stroke-width="1.5"/><rect x="660.0" y="36" width="196.0" height="216" fill="white" stroke="#E5E2DC"/><text x="677.0" y="69" fill="#2563EB" font-family="sans-serif" font-size="13">04</text><text x="677.0" y="105" fill="#0F172A" font-family="Georgia,serif" font-size="21">Follow through</text><text x="677.0" y="173" fill="#475569" font-family="sans-serif" font-size="12">Account planning and</text><text x="677.0" y="190" fill="#475569" font-family="sans-serif" font-size="12">pipeline tracking in</text><text x="677.0" y="207" fill="#475569" font-family="sans-serif" font-size="12">Salesforce</text></svg>